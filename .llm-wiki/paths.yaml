# ~/.llm-wiki/paths.yaml
# 留空或不写 = 使用内建默认
# 路径支持:相对(项目根)、~/前缀(用户 home)、绝对路径
version: 1

paths:
  raw_root: ~/knowledge-base/raw
  raw_assets: ~/knowledge-base/assets
  raw_sources: ~/knowledge-base/inbox
  wiki_root: ~/knowledge-base/wiki
  wiki_entities: ~/knowledge-base/wiki/people
  wiki_concepts: ~/knowledge-base/wiki/ideas
  wiki_sources: ~/knowledge-base/wiki/sources
  wiki_queries: ~/knowledge-base/wiki/queries
  wiki_comparisons: ~/knowledge-base/wiki/comparisons
  wiki_synthesis: ~/knowledge-base/wiki/synthesis
  index: ~/knowledge-base/wiki/index.md
  log: ~/knowledge-base/wiki/log.md
  overview: ~/knowledge-base/wiki/overview.md
  schema:  ~/knowledge-base/schema.md
  purpose: ~/knowledge-base/purpose.md